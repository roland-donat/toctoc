# Local routing services for TOCTOC (KTD1, R14): OSRM (foot profile, MLD) and VROOM.
# Both listen on 127.0.0.1 only; no address or name ever leaves the machine.
#
# Prepare the data once:  deploy/osrm/prepare-sene.sh "$TOCTOC_ROUTING_DATA"
# Start:                  TOCTOC_ROUTING_DATA=... docker compose -f deploy/docker-compose.routing.yml up -d
# Host ports default to 5000 (OSRM) and 3010 (VROOM), the defaults of config.routing;
# override with TOCTOC_OSRM_PORT / TOCTOC_VROOM_PORT and set routing.osrm_url / vroom_url to match.
# See docs/routing.md.
name: toctoc-routing

services:
  osrm:
    image: ghcr.io/project-osrm/osrm-backend:v6.0.0
    command:
      - osrm-routed
      - --algorithm
      - mld
      - --max-table-size
      - "1000"
      - /data/osrm/sene.osrm
    volumes:
      - ${TOCTOC_ROUTING_DATA:?set TOCTOC_ROUTING_DATA to the routing data directory}:/data:ro
    ports:
      - "127.0.0.1:${TOCTOC_OSRM_PORT:-5000}:5000"
    restart: unless-stopped

  vroom:
    image: ghcr.io/vroom-project/vroom-docker:v1.14.0
    environment:
      VROOM_ROUTER: osrm
    volumes:
      - ./vroom/config.yml:/conf/config.yml:ro
    ports:
      - "127.0.0.1:${TOCTOC_VROOM_PORT:-3010}:3000"
    depends_on:
      - osrm
    restart: unless-stopped
